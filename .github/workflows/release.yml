name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder creates the draft itself when it cannot find one, and it
  # runs its publishers concurrently — each one checking, then creating. The
  # Windows job alone forked v0.2.0 in two: consecutive asset ids, the same
  # second, two drafts. Linux uploaded into the one nobody published, so the
  # release went out with no Linux build on it at all.
  #
  # Creating it once, before anything builds, leaves every publisher a release
  # to find and nothing to create.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Open the draft every build publishes into
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes '' --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    # The draft is skipped on a manual run, which packages without publishing
    # and so has nothing to publish into.
    if: always() && needs.draft.result != 'failure'

    # One at a time, so the log of a failure is not interleaved with two other
    # platforms. The whole matrix is a few minutes and the minutes are free on
    # a public repository.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux
          # Pinned, not macos-latest. That label moved from macOS 15 to 26
          # mid-2026 and will move again, and this runner is the only Mac the
          # project has — an unannounced OS bump is an unannounced change to
          # the entire macOS test surface.
          - os: macos-15
            target: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uiohook-napi ships a linux-x64 prebuild, but the postinstall rebuild
      # compiles libuiohook from source here anyway and it wants the X11
      # headers. A bare runner has none of them, which is where the first tag
      # stopped. Do not remove this on the strength of the prebuild existing.
      - name: Install the X11 headers libuiohook compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev \
            libxrandr-dev libxrender-dev libxss-dev libxt-dev libxtst-dev

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # TCC keys a permission to the code identity. An ad-hoc signature is a new
      # identity every release, so every update costs the user both grants
      # again. A persistent certificate — self-signed is enough, Gatekeeper is
      # a separate question — keeps them. Without the secret the build stays
      # ad-hoc, as it always was.
      - name: Import the macOS signing identity
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_CERT: ${{ secrets.MAC_SIGN_CERT }}
          MAC_SIGN_CERT_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
        run: |
          [ -n "$MAC_SIGN_CERT" ] || { echo "no MAC_SIGN_CERT secret; signing ad-hoc"; exit 0; }
          echo "$MAC_SIGN_CERT" | base64 --decode > /tmp/sign.p12
          security create-keychain -p ci /tmp/sign.keychain
          security set-keychain-settings /tmp/sign.keychain
          security unlock-keychain -p ci /tmp/sign.keychain
          security import /tmp/sign.p12 -k /tmp/sign.keychain -P "$MAC_SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci /tmp/sign.keychain >/dev/null
          security list-keychains -d user -s /tmp/sign.keychain login.keychain
          openssl pkcs12 -in /tmp/sign.p12 -passin pass:"$MAC_SIGN_CERT_PASSWORD" -nokeys -clcerts -legacy 2>/dev/null > /tmp/sign.pem \
            || openssl pkcs12 -in /tmp/sign.p12 -passin pass:"$MAC_SIGN_CERT_PASSWORD" -nokeys -clcerts > /tmp/sign.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/sign.pem
          identity="$(security find-identity -v -p codesigning /tmp/sign.keychain | awk -F'"' 'NR==1 { print $2 }')"
          [ -n "$identity" ] || { echo "the certificate is not usable for code signing"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signing as \"$identity\""

      # A tag publishes. Anything else — a manual run to check the matrix still
      # builds — packages and throws the result away, so verifying a platform
      # never costs a tag or leaves a stray draft behind.
      - name: Package
        run: >
          npm run ${{ matrix.target }} --
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing identity is pinned to ad-hoc in electron-builder.yml.
          # Without this electron-builder also hunts the runner keychain, and on
          # a hosted Mac that search is noise at best.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Everything below here is macOS only, and exists because none of it can
      # be checked from the machine this was written on.
      - name: Check the bundle
        if: runner.os == 'macOS'
        run: bash scripts/check-mac-bundle.sh

      # The hardened runtime refuses to let anything attach to the process, and
      # the smoke test drives the app through exactly that. Rather than weaken
      # what users download, a throwaway copy is re-signed as debuggable. It is
      # the same bits otherwise, and it never leaves the runner.
      - name: Sign a debuggable copy to test
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/CofferTest.app
          cp -R release/mac-arm64/Coffer.app /tmp/CofferTest.app
          codesign --force --deep --sign - --options runtime --entitlements build/entitlements.test.plist /tmp/CofferTest.app
          if codesign -d --entitlements :- /tmp/CofferTest.app 2>/dev/null | grep -q get-task-allow; then
            echo "the copy is debuggable"
          else
            echo "re-signing did not take"
            exit 1
          fi

      # A gate, not a diagnostic. Four runs built Windows and Linux green while
      # startup was broken on all three platforms, because building an app and
      # running one are different questions and CI was only asking the first.
      #
      # This needs no debugger and no driver: the app says how far it got, and
      # reaching the end is the assertion.
      - name: The app has to start
        if: runner.os == 'macOS'
        env:
          COFFER_TRACE: '1'
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          set +e
          /tmp/CofferTest.app/Contents/MacOS/Coffer > boot.log 2>&1 &
          pid=$!

          for _ in $(seq 1 40); do
            grep -q '\[boot\] booted' boot.log && break
            sleep 1
          done

          alive=no
          kill -0 "$pid" 2>/dev/null && alive=yes

          echo "── $(wc -c < boot.log) bytes, still running: ${alive} ──"
          cat boot.log

          if grep -q '\[boot\] booted' boot.log; then
            kill "$pid" 2>/dev/null
            echo "started cleanly"
            exit 0
          fi

          echo "── it never finished starting. where is it? ──"
          if [ "$alive" = yes ]; then
            sample "$pid" 2 -file sample.txt >/dev/null 2>&1
            sed -n '/Call graph/,/Binary Images/p' sample.txt | head -40
          fi
          kill "$pid" 2>/dev/null
          exit 1

      - name: Smoke test the packaged app
        if: runner.os == 'macOS'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          COFFER_TRACE: '1'
          # Says what Playwright is waiting for, which a launch timeout does not.
          DEBUG: 'pw:electron*,pw:browser*'
        run: |
          npm i --no-save playwright-core
          node scripts/smoke-mac.mjs /tmp/CofferTest.app/Contents/MacOS/Coffer

      - name: Keep what the smoke test saw
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac
          path: smoke-mac.png
          if-no-files-found: warn

  # Nothing is public until every platform has landed its artefacts, so a
  # release is never half a release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
