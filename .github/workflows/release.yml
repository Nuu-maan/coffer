name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One at a time. Every job publishes into the same draft release, and
    # runners creating it at once is a race with nothing to gain: the whole
    # matrix is a few minutes and the minutes are free on a public repository.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux
          # Pinned, not macos-latest. That label moved from macOS 15 to 26
          # mid-2026 and will move again, and this runner is the only Mac the
          # project has — an unannounced OS bump is an unannounced change to
          # the entire macOS test surface.
          - os: macos-15
            target: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uiohook-napi ships a linux-x64 prebuild, but the postinstall rebuild
      # compiles libuiohook from source here anyway and it wants the X11
      # headers. A bare runner has none of them, which is where the first tag
      # stopped. Do not remove this on the strength of the prebuild existing.
      - name: Install the X11 headers libuiohook compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev \
            libxrandr-dev libxrender-dev libxss-dev libxt-dev libxtst-dev

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # A tag publishes. Anything else — a manual run to check the matrix still
      # builds — packages and throws the result away, so verifying a platform
      # never costs a tag or leaves a stray draft behind.
      - name: Package
        run: >
          npm run ${{ matrix.target }} --
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing identity is pinned to ad-hoc in electron-builder.yml.
          # Without this electron-builder also hunts the runner keychain, and on
          # a hosted Mac that search is noise at best.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Everything below here is macOS only, and exists because none of it can
      # be checked from the machine this was written on.
      - name: Check the bundle
        if: runner.os == 'macOS'
        run: bash scripts/check-mac-bundle.sh

      # The hardened runtime refuses to let anything attach to the process, and
      # the smoke test drives the app through exactly that. Rather than weaken
      # what users download, a throwaway copy is re-signed as debuggable. It is
      # the same bits otherwise, and it never leaves the runner.
      - name: Sign a debuggable copy to test
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/CofferTest.app
          cp -R release/mac-arm64/Coffer.app /tmp/CofferTest.app
          codesign --force --deep --sign - --options runtime --entitlements build/entitlements.test.plist /tmp/CofferTest.app
          if codesign -d --entitlements :- /tmp/CofferTest.app 2>/dev/null | grep -q get-task-allow; then
            echo "the copy is debuggable"
          else
            echo "re-signing did not take"
            exit 1
          fi

      # Runs on its own first. The last three runs produced a process that was
      # alive, silent, and had opened no debugging port — which is what Electron
      # looks like when the main script fails to load and it puts up an error
      # dialog nobody is there to see. sample() reads the stack of the live
      # process, and the unified log has whatever macOS thought of it.
      - name: Ask macOS what the app is doing
        if: runner.os == 'macOS'
        env:
          COFFER_TRACE: '1'
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          set +e
          started=$(date +%s)
          /tmp/CofferTest.app/Contents/MacOS/Coffer --remote-debugging-port=9223 > boot.log 2>&1 &
          pid=$!
          sleep 15

          echo "── $(wc -c < boot.log) bytes of its own output ──"
          cat boot.log

          if kill -0 "$pid" 2>/dev/null; then
            echo "── still alive: where is it stuck? ──"
            sample "$pid" 2 -file sample.txt >/dev/null 2>&1
            # The leaf frames are the answer; the whole sample is far too long.
            grep -E 'Thread_|NSAlert|RunLoop|dyld|node::|electron::|uv_' sample.txt | head -40
            echo "── main thread, top frames ──"
            sed -n '/Call graph/,/Binary Images/p' sample.txt | head -45
          else
            echo "── it exited on its own ──"
          fi

          kill "$pid" 2>/dev/null

          echo "── what macOS logged about it ──"
          since="$(date -r "$started" '+%Y-%m-%d %H:%M:%S')"
          log show --predicate 'process == "Coffer"' --style compact --start "$since" 2>/dev/null | head -40
          exit 0

      - name: Smoke test the packaged app
        if: runner.os == 'macOS'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          COFFER_TRACE: '1'
          # Says what Playwright is waiting for, which a launch timeout does not.
          DEBUG: 'pw:electron*,pw:browser*'
        run: |
          npm i --no-save playwright-core
          node scripts/smoke-mac.mjs /tmp/CofferTest.app/Contents/MacOS/Coffer

      - name: Keep what the smoke test saw
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac
          path: smoke-mac.png
          if-no-files-found: warn

  # Nothing is public until every platform has landed its artefacts, so a
  # release is never half a release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
