name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One at a time. Both jobs publish into the same draft release, and two
    # runners creating it at once is a race with nothing to gain: the whole
    # matrix is a few minutes and the minutes are free on a public repository.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uiohook-napi has no prebuild for Linux, so postinstall compiles
      # libuiohook from source and it wants the X11 headers. A bare runner has
      # none of them, which is where the first tag stopped.
      - name: Install the X11 headers libuiohook compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package and upload to the draft release
        run: npm run ${{ matrix.target }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Nothing is public until every platform has landed its artefacts, so a
  # release is never half a release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
