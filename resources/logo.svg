<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coffer">
  <title>Coffer</title>

  <!--
    The app icon: a coffer, drawn duotone. One hue throughout — #A96A21 — and
    the depth comes from stacking tones of it rather than from a second colour,
    a gradient or a shadow. Tile, lid, body, straps, band, lock plate: each
    plane is a step further into the hue than the one behind it, and every
    outline is the hue at full strength on a single stroke weight, round joins.

    The tones are mixed with white and set opaque rather than laid on as
    opacity, so a nearer plane covers what is under it. Stacked alphas make the
    seam show through the lock plate and the band stripe across its face.

    The tile is a superellipse (|x|⁵ + |y|⁵ = 1), not a rounded rectangle — the
    curvature runs continuously into the straight edges. The path is eight
    cubics fitted to that curve, within 1.6px at 512.
  -->

  <!-- The tile: the hue at a tenth. -->
  <path
    fill="#F6F0E9"
    d="M512 256C512 404.56 511.72 446 478.86 478.86C446 511.72 404.56 512 256 512C107.44 512 66 511.72 33.14 478.86C0.28 446 0 404.56 0 256C0 107.44 0.28 66 33.14 33.14C66 0.28 107.44 0 256 0C404.56 0 446 0.28 478.86 33.14C511.72 66 512 107.44 512 256Z"
  />

  <defs>
    <!-- The chest's own outline, so the planes inside it stop where it does. -->
    <clipPath id="hull">
      <path d="M184 84H328A144 144 0 0 1 472 228V384A44 44 0 0 1 428 428H84A44 44 0 0 1 40 384V228A144 144 0 0 1 184 84Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#hull)">
    <!-- Body, and the lid a shade lighter for the light it takes from above. -->
    <rect x="40" y="84" width="432" height="344" fill="#EADBCA" />
    <rect x="40" y="84" width="432" height="144" fill="#F1E7DB" />

    <!-- Straps down the sides, then the band across the seam over them. -->
    <g fill="#E0C9AF">
      <rect x="106" y="84" width="56" height="344" />
      <rect x="350" y="84" width="56" height="344" />
    </g>
    <rect x="40" y="198" width="432" height="60" fill="#D7BA99" />
  </g>

  <g
    fill="none"
    stroke="#A96A21"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- The silhouette, and the seam where the lid meets the body. -->
    <path d="M184 84H328A144 144 0 0 1 472 228V384A44 44 0 0 1 428 428H84A44 44 0 0 1 40 384V228A144 144 0 0 1 184 84Z" />
    <path d="M58 228H454" />
  </g>

  <!-- The lock plate: the nearest plane, and the one that interrupts the seam. -->
  <rect
    x="190"
    y="162"
    width="132"
    height="132"
    rx="30"
    fill="#CDA97E"
    stroke="#A96A21"
    stroke-width="28"
    stroke-linejoin="round"
  />

  <!-- The keyhole: a bore and a tapered ward, the one place inside the plate
       where the hue is solid. It falls away below about 32px, where the plate
       alone still carries the shape. -->
  <g fill="#A96A21">
    <circle cx="256" cy="209" r="19" />
    <path d="M248 209H264L269 259H243Z" />
  </g>
</svg>
