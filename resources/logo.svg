<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coffer">
  <title>Coffer</title>

  <!--
    The app icon: the coffer drawn as a box in isometric, duotone. One hue
    throughout — #A96A21 — and the depth comes from stacking tones of it rather
    than from a second colour, a gradient or a shadow. Left wall, right wall,
    lid: each plane is a step further into the hue than the one behind it.

    The tones are mixed with the tile and set opaque rather than laid on as
    opacity, so nothing shows through anything. resources/logo-mark.svg is the
    same drawing in currentColor, where the same tones are reached with
    fill-opacity instead; the geometry between the two has to stay in step.

    The tile is a superellipse (|x|⁵ + |y|⁵ = 1), not a rounded rectangle — the
    curvature runs continuously into the straight edges. The path is eight
    cubics fitted to that curve, within 1.6px at 512.
  -->

  <!-- The tile: the hue at a tenth. -->
  <path
    fill="#F6F0E9"
    d="M512 256C512 404.56 511.72 446 478.86 478.86C446 511.72 404.56 512 256 512C107.44 512 66 511.72 33.14 478.86C0.28 446 0 404.56 0 256C0 107.44 0.28 66 33.14 33.14C66 0.28 107.44 0 256 0C404.56 0 446 0.28 478.86 33.14C511.72 66 512 107.44 512 256Z"
  />

  <!--
    The mark is drawn in its own units and placed here, so its proportions are
    the ones the drawing was made at. 360px across, centred on the tile.
  -->
  <g transform="translate(38.9 20.8) scale(18.09)" fill-rule="evenodd" stroke-width="1.1" stroke-linejoin="miter" stroke-miterlimit="1.5">
    <!-- The left wall, turned away from the light: the hue at a half. -->
    <path d="M2.6 9.3 L12 14 L12 21.4 L2.6 16.7 Z" fill="#D0AD85" stroke="#D0AD85" />
    <!-- The right wall, three quarters of the way in. -->
    <path d="M21.4 9.3 L12 14 L12 21.4 L21.4 16.7 Z" fill="#BC8C53" stroke="#BC8C53" />
    <!-- The lid at full strength, with the slot cut out of it to the tile. -->
    <path d="M12 4.6 L21.4 9.3 L12 14 L2.6 9.3 Z M16.25 11.58 L13.75 12.83 L7.75 9.58 L10.25 8.33 Z" fill="#A96A21" stroke="#A96A21" />
  </g>
</svg>
