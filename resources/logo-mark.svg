<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.9 3.9 20.2 18.2" width="20.2" height="18.2" role="img" aria-label="Coffer">
  <title>Coffer</title>

  <!--
    The mark: the coffer drawn as a box in isometric, everything in
    currentColor so it takes the colour it is set in.

    Three planes, one hue, and the depth comes from how far into that hue each
    plane is taken rather than from a second colour or a shadow. The two walls
    are held back to a half and three quarters; the lid is the hue at full
    strength, with the slot cut out of it by fill-rule rather than drawn over
    it, so nothing is stacked on anything and no seam darkens where two
    translucent planes meet.

    Stroke and fill carry the same opacity on each plane, which keeps a plane
    reading as one solid piece instead of a fill with a rim around it.

    The stroke is heavier than the app icon's — 1.4 against 1.1 — and the
    viewBox is opened up to hold it. At the 16px a title bar and a menu bar ask
    for, the mark's weight has to come up or it renders as grey fuzz.
  -->

  <g fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter" stroke-miterlimit="1.5">
    <!-- The left wall, turned away from the light. -->
    <path d="M2.6 9.3 L12 14 L12 21.4 L2.6 16.7 Z" fill-opacity="0.5" stroke-opacity="0.5" />
    <!-- The right wall, a step further into the hue. -->
    <path d="M21.4 9.3 L12 14 L12 21.4 L21.4 16.7 Z" fill-opacity="0.75" stroke-opacity="0.75" />
    <!-- The lid at full strength, with the slot cut out of it. -->
    <path d="M12 4.6 L21.4 9.3 L12 14 L2.6 9.3 Z M16.25 11.58 L13.75 12.83 L7.75 9.58 L10.25 8.33 Z" />
  </g>
</svg>
